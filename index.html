<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemini Multilingual Voice Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🎙️ Gemini Voice + Image Chatbot</h1>
      <div class="lang-picker">
        <label for="language">Language:</label>
        <select id="language">
          {% for code, info in languages.items() %}
            <option value="{{ code }}">{{ info.name }}</option>
          {% endfor %}
        </select>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="chat">💬 Chat</button>
      <button class="tab-btn" data-tab="analyze">🖼️ Analyze Image</button>
      <button class="tab-btn" data-tab="generate">🎨 Generate Image</button>
    </nav>

    <!-- CHAT TAB -->
    <section id="chat" class="tab-panel active">
      <div id="chat-window" class="chat-window"></div>
      <div class="input-row">
        <button id="mic-btn" title="Speak">🎤</button>
        <input id="chat-input" type="text" placeholder="Type or speak your message..." />
        <button id="send-btn">Send</button>
        <label class="toggle">
          <input type="checkbox" id="speak-replies" checked />
          Speak replies
        </label>
      </div>
      <p id="mic-status" class="status"></p>
    </section>

    <!-- IMAGE ANALYSIS TAB -->
    <section id="analyze" class="tab-panel">
      <input type="file" id="image-input" accept="image/*" />
      <img id="image-preview" class="preview" />
      <div class="input-row">
        <button id="mic-btn-analyze" title="Speak your question">🎤</button>
        <input id="analyze-question" type="text" placeholder="Ask something about the image..." />
        <button id="analyze-btn">Analyze</button>
      </div>
      <p id="analyze-mic-status" class="status"></p>
      <div id="analyze-result" class="result-box"></div>
    </section>

    <!-- IMAGE GENERATION TAB -->
    <section id="generate" class="tab-panel">
      <div class="input-row">
        <button id="mic-btn-generate" title="Speak your prompt">🎤</button>
        <input id="generate-prompt" type="text" placeholder="Describe the image you want..." />
        <button id="generate-btn">Generate</button>
      </div>
      <p id="generate-mic-status" class="status"></p>
      <div id="generate-result" class="result-box"></div>
    </section>

  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
